<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>饿啦 · 图片修复</title>
<style>
body{font-family:-apple-system,sans-serif;background:#FDF6EC;color:#4A3728;padding:20px;max-width:620px;margin:0 auto}
h2{font-size:20px}
pre{background:#fff;border:1px solid #F0E3D0;border-radius:12px;padding:14px;font-size:13px;white-space:pre-wrap;word-break:break-all;line-height:1.8}
button{padding:14px 24px;border-radius:12px;border:none;background:#D95F3B;color:#fff;font-size:16px;margin:10px 6px 0 0}
button:disabled{opacity:.4}
</style>
</head>
<body>
<h2>饿啦 · 图片修复工具</h2>
<pre id="out">正在读取数据库…</pre>
<button id="fixBtn" onclick="doFix()">一键修复图片</button>
<button onclick="location.reload()">重新检测</button>
<script>
const out = document.getElementById('out');
const fixBtn = document.getElementById('fixBtn');
let db;
async function open() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('xiaozao', 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      d.createObjectStore('recipes', { keyPath: 'id', autoIncrement: true });
      d.createObjectStore('categories', { keyPath: 'id', autoIncrement: true });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function getAll(store) {
  return new Promise((res, rej) => {
    const rq = db.transaction(store, 'readonly').objectStore(store).getAll();
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
function put(store, v) {
  return new Promise((res, rej) => {
    const rq = db.transaction(store, 'readwrite').objectStore(store).put(v);
    rq.onsuccess = res; rq.onerror = () => rej(rq.error);
  });
}
function toDataURL(b) {
  if (typeof b === 'string') return Promise.resolve(b.startsWith('data:') ? b : '');
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = () => rej(r.error);
    r.readAsDataURL(b);
  });
}
async function report() {
  const recipes = await getAll('recipes');
  let dataURL = 0, blob = 0, bad = 0, noImg = 0;
  for (const r of recipes) {
    const imgs = r.images || [];
    if (!imgs.length) { noImg++; continue; }
    for (const im of imgs) {
      if (typeof im === 'string' && im.startsWith('data:')) dataURL++;
      else if (im && im.size !== undefined) blob++;
      else bad++;
    }
  }
  return `菜谱总数：${recipes.length}\n图片格式统计：dataURL字符串 = ${dataURL} 道，Blob = ${blob} 张，失效/未知 = ${bad} 张，无图菜 = ${noImg} 道\n\n` +
    (blob > 0 ? '⚠️ 发现旧格式（Blob）图片——iOS 会在后台回收它们，这就是图片消失的原因。\n点下面「一键修复图片」把全部图片转成永久字符串格式。'
              : (dataURL > 0 ? '✅ 图片已是新格式（不会被回收）。如果编辑后图片仍消失，请截图联系。' : '库里没有带图的菜谱。'));
}
async function doFix() {
  fixBtn.disabled = true;
  out.textContent = '正在修复…';
  const recipes = await getAll('recipes');
  let converted = 0, dropped = 0, touched = 0;
  for (const r of recipes) {
    const imgs = r.images || [];
    if (!imgs.length) continue;
    const outImgs = [];
    let changed = false;
    for (const im of imgs) {
      try {
        if (typeof im === 'string' && im.startsWith('data:')) { outImgs.push(im); continue; }
        if (im && im.size > 0) {
          const du = await toDataURL(im);
          if (du) { outImgs.push(du); converted++; changed = true; continue; }
        }
        dropped++; changed = true;
      } catch (e) { dropped++; changed = true; }
    }
    if (changed) { r.images = outImgs; await put('recipes', r); touched++; }
  }
  out.textContent = `修复完成！\n转换 Blob → 永久字符串：${converted} 张\n清除失效图：${dropped} 张\n更新菜谱：${touched} 道\n\n现在回到「饿啦」杀掉重开，图片就不会再消失了。\n（建议：设置 → 导出备份，做一次新留底）`;
  fixBtn.disabled = false;
}
(async () => {
  try {
    db = await open();
    out.textContent = await report();
  } catch (e) {
    out.textContent = '读取失败：' + (e.message || e);
  }
})();
</script>
</body>
</html>
